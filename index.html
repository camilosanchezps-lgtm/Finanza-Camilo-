```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanzasPro Camilo</title>
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .modal-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 pb-24">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        <header class="bg-indigo-600 pt-10 pb-10 px-6 rounded-b-[2rem] shadow-lg text-white">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-black italic">FinanzasPro</h1>
                <div class="bg-white/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Memoria Local</div>
            </div>
            <div class="text-center">
                <p class="text-indigo-100 text-[10px] font-bold uppercase mb-1">Balance Neto</p>
                <h2 id="total-balance" class="text-4xl font-black mb-6">$0</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/10 p-3 rounded-2xl text-left">
                        <p class="text-[9px] font-bold text-indigo-100 uppercase">Ingresos</p>
                        <p id="total-income" class="font-bold text-sm">$0</p>
                    </div>
                    <div class="bg-white/10 p-3 rounded-2xl text-left">
                        <p class="text-[9px] font-bold text-indigo-100 uppercase">Gastos</p>
                        <p id="total-expenses" class="font-bold text-sm">$0</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="px-6 py-6 space-y-4" id="list-container">
            </main>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] bg-white border shadow-2xl p-2 rounded-full flex justify-between items-center">
            <div class="flex-1 text-center text-indigo-600"><i data-lucide="home" class="mx-auto"></i></div>
            <button id="add-trigger" class="w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center -translate-y-4 shadow-lg active:scale-90 transition-all">
                <i data-lucide="plus" class="w-8 h-8"></i>
            </button>
            <div class="flex-1 text-center text-slate-300"><i data-lucide="bar-chart" class="mx-auto"></i></div>
        </nav>

        <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-end z-50">
            <div class="w-full bg-white rounded-t-[2.5rem] p-8 modal-up">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black">Nuevo Registro</h3>
                    <button id="close-modal" class="text-slate-400 p-2"><i data-lucide="x"></i></button>
                </div>
                <form id="form" class="space-y-4">
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button type="button" id="set-exp" class="flex-1 py-2 rounded-lg font-bold text-xs bg-white text-rose-500 shadow-sm">Gasto</button>
                        <button type="button" id="set-inc" class="flex-1 py-2 rounded-lg font-bold text-xs text-slate-400">Ingreso</button>
                    </div>
                    <input type="text" id="desc" placeholder="Descripción" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold" required>
                    <input type="number" id="amt" placeholder="Monto" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-black text-2xl" required>
                    <button type="submit" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('finanzas_camilo')) || [];
        let type = 'expense';

        const render = () => {
            const list = document.getElementById('list-container');
            const tInc = transactions.filter(t => t.type === 'income').reduce((a, b) => a + Number(b.amt), 0);
            const tExp = transactions.filter(t => t.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
            
            document.getElementById('total-balance').innerText = `$${(tInc - tExp).toLocaleString()}`;
            document.getElementById('total-income').innerText = `$${tInc.toLocaleString()}`;
            document.getElementById('total-expenses').innerText = `$${tExp.toLocaleString()}`;

            list.innerHTML = transactions.map((t, i) => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                            <i data-lucide="${t.type === 'income' ? 'arrow-up' : 'shopping-cart'}"></i>
                        </div>
                        <div>
                            <p class="font-bold text-sm">${t.desc}</p>
                            <p class="text-[10px] text-slate-400 uppercase font-bold">${t.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-black ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                            ${t.type === 'income' ? '+' : '-'}$${Number(t.amt).toLocaleString()}
                        </span>
                        <button onclick="del(${i})" class="text-slate-200 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
            localStorage.setItem('finanzas_camilo', JSON.stringify(transactions));
        };

        window.del = (i) => { transactions.splice(i, 1); render(); };

        document.getElementById('add-trigger').onclick = () => document.getElementById('modal').classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => document.getElementById('modal').classList.add('hidden');
        
        document.getElementById('set-inc').onclick = () => { 
            type = 'income'; 
            document.getElementById('set-inc').className = "flex-1 py-2 rounded-lg font-bold text-xs bg-white text-emerald-500 shadow-sm";
            document.getElementById('set-exp').className = "flex-1 py-2 rounded-lg font-bold text-xs text-slate-400";
        };
        document.getElementById('set-exp').onclick = () => { 
            type = 'expense'; 
            document.getElementById('set-exp').className = "flex-1 py-2 rounded-lg font-bold text-xs bg-white text-rose-500 shadow-sm";
            document.getElementById('set-inc').className = "flex-1 py-2 rounded-lg font-bold text-xs text-slate-400";
        };

        document.getElementById('form').onsubmit = (e) => {
            e.preventDefault();
            transactions.unshift({
                desc: document.getElementById('desc').value,
                amt: document.getElementById('amt').value,
                type: type,
                date: new Date().toLocaleDateString()
            });
            e.target.reset();
            document.getElementById('modal').classList.add('hidden');
            render();
        };

        render();
    </script>
</body>
</html>
